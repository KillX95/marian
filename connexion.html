<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to MarianINC</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f6f7fb;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --input-bg: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(900px 450px at 50% -150px, #e0e7ff 0%, transparent 65%),
                var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: var(--card);
            padding: 2.75rem 2.5rem;
            border-radius: 22px;
            box-shadow: 0 24px 48px -16px rgba(17, 24, 39, 0.18);
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border);
            animation: rise 0.45s ease-out;
        }
        .badge {
            width: 56px;
            height: 56px;
            margin: 0 auto 1.1rem;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #fff;
            box-shadow: 0 10px 24px -6px rgba(79, 70, 229, 0.5);
        }
        h1 { margin: 0 0 0.4rem 0; font-size: 1.6rem; font-weight: 800; text-align: center; letter-spacing: -0.02em; color: #111827; }
        .subtitle { text-align: center; color: var(--muted); margin-bottom: 2rem; font-size: 0.94rem; }
        .form-group { margin-bottom: 1.25rem; }
        label.field-label { display: block; margin-bottom: 0.45rem; font-weight: 700; font-size: 0.84rem; color: #374151; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            background: var(--input-bg);
            color: var(--text);
            font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }
        .pw-wrap { position: relative; }
        .pw-wrap input { padding-right: 3rem; }
        .pw-toggle {
            position: absolute;
            right: 0.55rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 1.1rem;
            color: var(--muted);
            padding: 0.3rem;
            line-height: 1;
        }
        .pw-toggle:hover { color: var(--primary); }
        button[type="submit"] {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), #6d28d9);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            margin-top: 0.75rem;
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
            box-shadow: 0 12px 24px -8px rgba(79, 70, 229, 0.45);
        }
        button[type="submit"]:hover { filter: brightness(1.08); transform: translateY(-2px); box-shadow: 0 16px 30px -10px rgba(79, 70, 229, 0.5); }
        button[type="submit"]:active { transform: translateY(0); }
        .msg {
            margin-top: 1.25rem;
            text-align: center;
            font-size: 0.92rem;
            font-weight: 600;
            padding: 0.9rem 1rem;
            border-radius: 12px;
            display: none;
            animation: rise 0.3s ease-out;
        }
        .msg.info { display: block; background: #eef2ff; color: #4338ca; }
        .msg.ok { display: block; background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
        .msg.err { display: block; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .footer-note { text-align: center; margin-top: 1.5rem; font-size: 0.78rem; color: #94a3b8; }
        @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="4" y="11" width="16" height="9" rx="2"></rect>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
            </svg>
        </div>
        <h1>MarianINC</h1>
        <p class="subtitle">Log in to your account</p>
        <form id="loginForm">
            <div class="form-group">
                <label class="field-label">email</label>
                <input type="text" name="identifier" required autofocus autocomplete="username">
            </div>
            
            
            <div class="form-group">
                <label class="field-label">Password</label>
                <div class="pw-wrap">
                    <input type="password" name="password" required autocomplete="current-password" data-pw>
                    <button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
                </div>
            </div>
            
            <button type="submit">Log in</button>
        </form>
        <div id="message" class="msg"></div>
        <p class="footer-note">Safe login to MarianINC</p>
    </div>

    <script>
        document.querySelectorAll('[data-pw-toggle]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var input = btn.parentElement.querySelector('[data-pw]');
                input.type = input.type === 'password' ? 'text' : 'password';
            });
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const msgDiv = document.getElementById('message');
            msgDiv.className = 'msg info';
            msgDiv.innerText = 'Connexion en cours...';

            try {
                const response = await fetch('https://hagar-auth.vercel.app/api/hagar/login', {
                    method: 'POST',
                    headers: { 'X-Hagar-Token': '4525595acf7735c362bbb55c8aed39cfa53b52d7f3b1d9b9abc0f688660fe411' },
                    body: formData
                });
                const result = await response.json();
                if (response.ok) {
                    msgDiv.className = 'msg ok';
                    msgDiv.innerText = 'Login successful!';
                    console.log('User Data:', result.user_data);
		    window.location.href = "connected.html";
                } else {
                    msgDiv.className = 'msg err';
                    msgDiv.innerText = result.error || 'No Account.';
                }
            } catch (err) {
                msgDiv.className = 'msg err';
                msgDiv.innerText = 'Failed to contact server.';
            }
        });
    </script>
</body>
</html>
