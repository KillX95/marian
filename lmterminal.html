<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MarianINC</title>
<style>
  /* Thème sombre simple et propre */
  body {
    background-color: #121212;
    color: #eee;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    height: 100vh;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  h1 {
    margin-bottom: 20px;
    font-weight: 700;
    color: #4a90e2;
    user-select: none;
  }
  #search-container {
    width: 90%;
    max-width: 600px;
  }
  input[type="text"] {
    width: 100%;
    padding: 15px 22px;
    font-size: 1.3rem;
    border: none;
    border-radius: 10px;
    outline: none;
    background-color: #222;
    color: #eee;
    box-sizing: border-box;
    transition: background-color 0.3s;
  }
  input[type="text"]:focus {
    background-color: #333;
  }
  input[type="text"]::placeholder {
    color: #888;
  }
  button {
    margin-top: 15px;
    width: 100%;
    padding: 14px;
    font-size: 1.15rem;
    background-color: #3a3a3a;
    border: none;
    border-radius: 10px;
    color: #eee;
    cursor: pointer;
    font-weight: 600;
    transition: background-color 0.3s;
  }
  button:hover {
    background-color: #5a5a5a;
  }
</style>
</head>
<body>
  <h1>MarianINC</h1>
  <div id="search-container">
    <button id="Signup">Download on GitHub</button>
    <button id="Login">Download on LOOKI Website</button>
  </div>
</body>
<script>
  document.getElementById('Signup').addEventListener('click', function() {
    location.href = 'https://github.com/vichbcode/LOOKI/releases/tag/v1.0';
  });

  document.getElementById('Login').addEventListener('click', function() {
    location.href = 'https://looki-theta.vercel.app/LMTerminal.html#telechargement';
  });
</script>
</html>
